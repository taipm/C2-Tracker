[package]
name = "c2-tracker"
version = "0.1.0"
description = "C2-Tracker — realtime recording studio for Claude Code sessions"
authors = ["taipm"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "c2_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
